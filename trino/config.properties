# Trino con un solo nodo, que hace de coordinador y de worker a la vez.
coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}

# Memoria: Java tiene 2.2 GB (se define en JAVA_TOOL_OPTIONS en el docker-compose.yml).
# Cada consulta puede usar hasta 1.2 GB y dejamos 600 MB de colchon para el resto del proceso.
query.max-memory-per-node=1200MB
query.max-memory=1200MB
memory.heap-headroom-per-node=600MB
