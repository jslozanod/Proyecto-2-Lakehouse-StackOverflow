# Trino de un solo nodo (coordinador + worker).
coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}

# Memoria: el heap de la JVM es de 2.2 GB (JAVA_TOOL_OPTIONS en docker-compose.yml).
# Una consulta puede usar hasta 1.2 GB, y se deja 600 MB de margen para el resto del proceso.
query.max-memory-per-node=1200MB
query.max-memory=1200MB
memory.heap-headroom-per-node=600MB
